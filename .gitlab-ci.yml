default:
  image: mcr.microsoft.com/dotnet/sdk:10.0
  interruptible: true

stages: [lint, build, test, migration, functional, package]

workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_PIPELINE_SOURCE == "web"'
    - if: '$CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS && $CI_PIPELINE_SOURCE == "push"'
      when: never
    - if: '$CI_COMMIT_BRANCH == "develop" || $CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "feature/mongo-migration" || $CI_COMMIT_BRANCH =~ /^codex\//'
    - when: never

variables:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"
  NUGET_PACKAGES: "$CI_PROJECT_DIR/.nuget/packages"
  COVERAGE_THRESHOLD: "80"

cache:
  key: "nuget-net10-$CI_COMMIT_REF_SLUG"
  paths: [.nuget/packages/]

# port 2375 is confined to the disposable job/service network.
.docker-job:
  services:
    - name: docker:27.2.0-dind
      alias: docker
      command: ["--tls=false"]
      variables:
        HEALTHCHECK_TCP_PORT: "2375"
  variables:
    DOCKER_HOST: "tcp://docker:2375"
    DOCKER_TLS_CERTDIR: ""
    TESTCONTAINERS_HOST_OVERRIDE: "docker"
  before_script:
    - bash scripts/ci/install-tools.sh node docker
    - bash scripts/ci/wait-for-docker.sh

lint:
  stage: lint
  before_script:
    - bash scripts/ci/install-tools.sh node
  script:
    - dotnet restore CIS-WebAPI.slnx -m:1
    - dotnet format whitespace CIS-WebAPI.slnx --verify-no-changes --no-restore --verbosity minimal
    - node --test tests/coverage/*.test.cjs tests/phase2/*.test.cjs

build:
  stage: build
  script:
    - dotnet --info
    - dotnet restore CIS-WebAPI.slnx -m:1
    - dotnet build CIS-WebAPI.slnx --configuration Release --no-restore -m:1

dotnet-tests:
  extends: .docker-job
  stage: test
  timeout: 20m
  script:
    - bash scripts/ci/test-and-coverage.sh
  coverage: '/Line coverage: \d+(?:\.\d+)?%/'
  artifacts:
    when: always
    expire_in: 14 days
    paths: [TestResults/Phase2/CI-Tests/]
    reports:
      coverage_report:
        coverage_format: cobertura
        path: TestResults/Phase2/CI-Tests/merged/Cobertura.xml

migration-regressions:
  extends: .docker-job
  stage: test
  script:
    - node --test tests/migration/post-migration-sd3-perf.test.cjs

migration-validation:
  extends: .docker-job
  stage: migration
  timeout: 20m
  script:
    - node scripts/phase2/run-workflow.cjs --mode migration --output TestResults/Phase2/CI-Migration
  artifacts:
    when: always
    expire_in: 14 days
    paths: [TestResults/Phase2/CI-Migration/]

functional:
  extends: .docker-job
  stage: functional
  timeout: 20m
  before_script:
    - bash scripts/ci/install-tools.sh node docker postman
    - bash scripts/ci/wait-for-docker.sh
  script:
    - node scripts/phase2/run-workflow.cjs --mode functional --output TestResults/Phase2/CI-Functional
  artifacts:
    when: always
    expire_in: 14 days
    paths: [TestResults/Phase2/CI-Functional/]
    reports:
      junit:
        - TestResults/Phase2/CI-Functional/postman-MySQL/postman.junit.xml
        - TestResults/Phase2/CI-Functional/postman-MongoDB/postman.junit.xml

package-api:
  stage: package
  script:
    - dotnet publish CIS.API/CIS.API.csproj --configuration Release --output TestResults/Phase2/publish -m:1
  artifacts:
    name: "cis-api-$CI_COMMIT_SHORT_SHA"
    expire_in: 14 days
    paths: [TestResults/Phase2/publish/]
